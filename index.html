<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        #click-btn {
            font-size: 20px;
            padding: 15px;
            margin: 20px;
            cursor: pointer;
        }
        #upgrade-btn {
            font-size: 16px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Clicker Game</h1>
    <h2>Score: <span id="score">0</span></h2>
    <button id="click-btn">Click Me!</button>
    <h3>Points per Click: <span id="points-per-click">1</span></h3>
    <button id="upgrade-btn">Upgrade (Cost: 10)</button>

    <script>
        let score = 0;
        let pointsPerClick = 100;
        let upgradeCost = 10;

        const scoreDisplay = document.getElementById("score");
        const pointsDisplay = document.getElementById("points-per-click");
        const clickBtn = document.getElementById("click-btn");
        const upgradeBtn = document.getElementById("upgrade-btn");

        clickBtn.addEventListener("click", () => {
            score += pointsPerClick;
            scoreDisplay.textContent = score;
        });

        upgradeBtn.addEventListener("click", () => {
            if (score >= upgradeCost) {
                score -= upgradeCost;
                pointsPerClick++;
                upgradeCost = Math.floor(upgradeCost * 1.5); // Increase cost
                scoreDisplay.textContent = score;
                pointsDisplay.textContent = pointsPerClick;
                upgradeBtn.textContent = `Upgrade (Cost: ${upgradeCost})`;
            } else {
                alert("Not enough points to upgrade!");
            }
        });
    </script>
</body>
</html>
